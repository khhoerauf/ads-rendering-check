name: E2E Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
      - name: Cypress run E2E on Chrome
        uses: cypress-io/github-action@v7
        with:
          browser: chrome