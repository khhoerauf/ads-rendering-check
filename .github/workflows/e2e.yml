name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run E2E on Chrome
        uses: cypress-io/github-action@v7
        with:
          browser: chrome

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Bundle screenshots into report folder
        if: always()
        run: cp -r cypress-image-diff-screenshots cypress-image-diff-html-report/cypress-image-diff-screenshots

      - name: Publish visual diff report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: cypress-image-diff-html-report
          destination_dir: visual-report
